[package]
name = "raven-core"
description = "Pure Rust compiler core for Raven — no Node/WASM dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "raven_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"

[lints]
workspace = true
