<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    <style>
      .raven-beak { fill: #FFA500; }
      .raven-eye { fill: #000000; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" fill="url(#grad)" rx="12"/>
  
  <!-- Raven head (stylized) -->
  <circle cx="64" cy="48" r="28" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  
  <!-- Beak -->
  <polygon points="92,48 105,45 92,51" class="raven-beak" stroke="#000" stroke-width="0.5"/>
  
  <!-- Eye -->
  <circle cx="75" cy="42" r="4" class="raven-eye"/>
  <circle cx="76" cy="41" r="1.5" fill="#FFFFFF"/>
  
  <!-- Wing detail -->
  <path d="M 45 60 Q 35 55 30 70" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Programming symbol (code brackets) -->
  <g fill="#FFFFFF" font-size="24" font-family="monospace" font-weight="bold">
    <text x="64" y="95" text-anchor="middle" dominant-baseline="middle">&lt; &gt;</text>
  </g>
</svg>
