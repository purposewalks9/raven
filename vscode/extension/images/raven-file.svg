<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="fileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA3F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- File background -->
  <path d="M 40 20 L 200 20 Q 220 20 220 40 L 220 220 Q 220 240 200 240 L 60 240 Q 40 240 40 220 L 40 20" fill="url(#fileGrad)" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- File corner fold -->
  <polygon points="200,20 200,60 240,60" fill="#1a1a1a" opacity="0.3"/>
  
  <!-- Raven head (small, on file) -->
  <circle cx="128" cy="80" r="20" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  
  <!-- Beak -->
  <polygon points="148,80 160,78 148,82" fill="#FFA500"/>
  
  <!-- Eye -->
  <circle cx="138" cy="75" r="3" fill="#FFFFFF"/>
  
  <!-- File extension text -->
  <text x="128" y="160" font-size="56" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="monospace">.rv</text>
  
  <!-- Decoration lines -->
  <line x1="60" y1="190" x2="200" y2="190" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="210" x2="160" y2="210" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
</svg>
