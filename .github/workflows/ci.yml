name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native typechecker
        working-directory: crates/raven-node
        run: cargo build --release && cp ../target/release/libraven_node.so raven-node.linux-x64-gnu.node
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: npx vitest run
      - name: Clippy
        working-directory: crates
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        working-directory: crates
        run: cargo fmt --check
      - name: Build
        run: npx tsup src/index.ts src/cli/index.ts --format esm --dts --clean
